name: Validate

on:
  pull_request:
    paths:
      - 'themes/**'
      - 'themes.json'
      - 'schema/**'
      - 'scripts/**'

jobs:
  validate:
    name: Validate themes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate schema
        run: bun run validate
